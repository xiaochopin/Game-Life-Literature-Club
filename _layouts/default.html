<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav container">
        <a class="brand" href="{{ '/' | relative_url }}">Game Life Literature Club</a>
        <a class="nav-link" href="{{ '/about.html' | relative_url }}">关于</a>
      </nav>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">© {{ 'now' | date: "%Y" }} Game Life Literature Club</div>
    </footer>
  </body>
</html>
